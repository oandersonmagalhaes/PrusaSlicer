  - 0x0
  - 218.88x0
  - 218.88x122.88
  - 0x122.88
  display_width: 218.88
  display_height: 122.88
  display_pixels_x: 11520
  display_pixels_y: 5120
  display_orientation: landscape
  display_mirror_x: 1
  display_mirror_y: 0
  max_print_height: 260
  absolute_correction: 0
  elefant_foot_compensation: 0.2
  elefant_foot_min_width: 0.2
  gamma_correction: 1
  relative_correction: [1.0, 1.0]
  min_exposure_time: 1
  max_exposure_time: 120
  min_initial_exposure_time: 1
  max_initial_exposure_time: 300
  thumbnails: 290x290/PNG, 116x116/PNG
  sla_archive_format: GOO
  printer_model: SATURN3-ULTRA
  printer_technology: SLA
  printer_notes: |-
    PRINTER_VENDOR_ELEGOO
    PRINTER_MODEL_SATURN3_ULTRA
    FILEFORMAT_GOO

    START_CUSTOM_VALUES
    LightOffDelay_0
    BottomLightOffDelay_0
    BottomLiftHeight_7
    LiftHeight_7
    BottomLiftSpeed_70
    LiftSpeed_70
    RetractSpeed_210
    BottomLightPWM_255
    LightPWM_255
    END_CUSTOM_VALUES
