# The printer values come from the SBM 2.9 profiles. UVtools reads the settings
# PrusaSlicer has no field for (lift, retract, light PWM) from printer_notes.
id: sbm-halot-r6
kind: sla_printer
name: Creality HALOT-R6
condition: printer.model == "HALOT-R6"
values:
  bed_shape:
  - 0x0
  - 82.62x0
  - 82.62x130.56
  - 0x130.56
  display_width: 82.62
  display_height: 130.56
  display_pixels_x: 1620
  display_pixels_y: 2560
  display_orientation: landscape
  display_mirror_x: 0
  display_mirror_y: 0
  max_print_height: 160
  absolute_correction: 0
  elefant_foot_compensation: 0.2
  elefant_foot_min_width: 0.2
  gamma_correction: 1
  relative_correction: [1.0, 1.0]
  min_exposure_time: 1
  max_exposure_time: 120
  min_initial_exposure_time: 1
  max_initial_exposure_time: 300
  thumbnails: 116x116/PNG, 290x290/PNG
  sla_archive_format: CXDLPV4
  printer_model: HALOT-R6
  printer_technology: SLA
  printer_notes: |-
    PRINTER_VENDOR_CREALITY
    PRINTER_MODEL_HALOT-R6
    FILEFORMAT_CXDLPV4

    START_CUSTOM_VALUES
    WaitTimeBeforeCure_2
    BottomLiftHeight_7
    LiftHeight_6
    BottomLiftSpeed_80
    LiftSpeed_80
    RetractSpeed_150
    BottomLightPWM_255
    LightPWM_255
    END_CUSTOM_VALUES
---
id: sbm-saturn3-ultra
kind: sla_printer
name: Elegoo Saturn 3 Ultra
condition: printer.model == "SATURN3-ULTRA"
values:
